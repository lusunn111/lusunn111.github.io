about:
  - >-
    I am an undergraduate in Computer Science and Technology at <a href="https://www.cug.edu.cn/" target="_blank" rel="noopener noreferrer">China University of Geosciences (Wuhan)</a>, and an incoming Ph.D. student in Computer Science at <a href="https://www.pku.edu.cn/" target="_blank" rel="noopener noreferrer">Peking University</a>, starting in Fall 2027. I currently work as a research intern in <a href="https://if-lab-pku.github.io/" target="_blank" rel="noopener noreferrer">IF-Lab</a> under the supervision of <a href="https://if-lab-pku.github.io/" target="_blank" rel="noopener noreferrer">Prof. Xiang Chen</a>.
  - My research focuses on efficient systems for embodied intelligence, particularly efficient inference for vision-language-action and vision-language-navigation models, token caching, speculative decoding, world models, and Physical AI.

