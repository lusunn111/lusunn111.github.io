about:
  - >-
    I am an undergraduate in Computer Science and Technology at <a href="https://www.cug.edu.cn/" target="_blank" rel="noopener noreferrer">China University of Geosciences (Wuhan)</a>, and an incoming Ph.D. student at the <a href="https://cs.pku.edu.cn/" target="_blank" rel="noopener noreferrer">School of Computer Science, Peking University</a>, starting in Fall 2027. I currently work as a research intern in <a href="https://if-lab-pku.github.io/" target="_blank" rel="noopener noreferrer">IF-Lab</a> under the supervision of <a href="https://if-lab-pku.github.io/" target="_blank" rel="noopener noreferrer">Prof. Xiang Chen</a>.
  - >-
    I build efficient systems for Physical AI. My current work asks a simple question: how can vision-language-action, vision-language-navigation, and world-action models run fast enough, reliably enough, and efficiently enough for real robots? I explore speculative decoding, token caching, sparse computation, and edge-cloud collaboration from algorithm design to runtime implementation.
  - >-
    In the long run, I am interested in the system bottlenecks behind long-horizon reasoning, physical consistency, and closed-loop robot control. 🤝 I am always happy to discuss research and open-source collaboration in embodied AI systems, efficient inference, and related infrastructure. If our interests overlap, feel free to email me.

